<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 752 560" width="752" height="560">
<title>Câblage : D9 vers SIG du module MOSFET, Vin et GND vers l'entrée 12 V du module, pompe sur V+ et V− avec une diode, bouton entre D2 et GND</title>
<style>
:root { --bg:#EBEFF2; --surface:#FFFFFF; --ink:#121B24; --muted:#526170; --line:#C3CDD6;
  --accent:#0A5D7A; --accent-soft:#D3E7EE; --warn-bg:#FFF3D6; --warn-line:#D99A00; --warn-ink:#4A3700; --danger:#BF2229;
  --w-pos:#D7262E; --w-gnd:#1E2328; --w-sig:#EE8600; --w-btn:#2873CF; --w-usb:#707D8A;
  --pcb:#0C8287; --pcb-ink:#E9FBFB; --hdr:#1A1F25; --pin:#D9B55A; --chip:#1F262E; --chip-ink:#C4D0DA;
  --metal:#B5BDC5; --psu:#262B31; --term:#2E9A5B; --mod:#1D3D6E; --mod-ink:#E4ECF8;
  --water:#9FD3EA; --water-line:#2E8BB5; --tube:#E9EEF2; --tube-line:#8FA1B0; --pump:#2A3037; --pump-ink:#E6EAEE;
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; }
svg { color: var(--ink); }
.pcb { fill: var(--pcb); } .mod { fill: var(--mod); } .chip { fill: var(--chip); } .hdr { fill: var(--hdr); } .pin { fill: var(--pin); }
.metal { fill: var(--metal); } .usb-in { fill:#3A4148; } .jack { fill:#1C1F23; stroke: var(--metal); stroke-width:1; }
.term { fill: var(--term); } .screw { fill: var(--metal); stroke:#7D868F; stroke-width:1.5; }
.pcb-name { fill: var(--pcb-ink); font: 700 17px var(--font-display); letter-spacing:.04em; }
.pcb-s { fill: var(--pcb-ink); font: 500 10px var(--font-mono); }
.pin-t { fill: var(--pcb-ink); font: 700 10px var(--font-mono); }
.chip-t { fill: var(--chip-ink); font: 600 10px var(--font-mono); }
.lbl { fill: var(--ink); font: 600 13px var(--font-body); }
.sub { fill: var(--muted); font: 400 12px var(--font-body); }
.sub.red { fill: var(--danger); font-weight: 600; } .sub.accent { fill: var(--accent); font-weight: 600; }
.mono { fill: var(--ink); font: 500 11.5px var(--font-mono); }
.wire { fill:none; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; }
.w-pos { stroke: var(--w-pos); } .w-gnd { stroke: var(--w-gnd); } .w-sig { stroke: var(--w-sig); } .w-btn { stroke: var(--w-btn); }
.w-usb { stroke: var(--w-usb); stroke-width:5; } .cable { fill:none; stroke:#4A525A; stroke-width:5; stroke-linecap:round; }
.dot { stroke: var(--surface); stroke-width:1.5; } .dot.pos { fill: var(--w-pos); } .dot.gnd { fill: var(--w-gnd); } .dot.sig { fill: var(--w-sig); } .dot.btn { fill: var(--w-btn); }
.psu { fill: var(--psu); } .psu-t { fill:#F2F4F6; font: 700 15px var(--font-display); letter-spacing:.05em; } .psu-s { fill:#AEB7C0; font: 400 10.5px var(--font-body); }
.plug { fill:#3B434B; }
.pump { fill: var(--pump); } .pump-t { fill: var(--pump-ink); font: 700 13px var(--font-display); letter-spacing:.06em; }
.rotor { fill: none; stroke: var(--pump-ink); stroke-width: 2; } .roller { fill: var(--metal); }
.tube { fill:none; stroke: var(--tube-line); stroke-width:9; stroke-linecap:round; stroke-linejoin:round; }
.tube-in { fill:none; stroke: var(--water); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
.bottle { fill: var(--surface); stroke: var(--ink); stroke-width:1.6; } .water { fill: var(--water); }
.cap { fill: var(--accent); }
.diode { fill:#1E2328; } .diode-band { fill: var(--metal); }
.btn-base { fill:#262B31; } .btn-top { fill: var(--w-btn); }
.box { fill: var(--surface); stroke: var(--ink); stroke-width:1.4; } .box.hl { fill: var(--accent-soft); stroke: var(--accent); stroke-width:2; }
.box.pwr { stroke: var(--w-pos); stroke-width:2; } .box.water { fill:#E3F3FA; stroke: var(--water-line); stroke-width:2; }
.flow { fill:none; stroke: var(--ink); stroke-width:1.8; } .flow.sig { stroke: var(--w-sig); stroke-width:3; } .flow.pwr { stroke: var(--w-pos); stroke-width:2.4; }
.flow.water { stroke: var(--water-line); stroke-width:3; } .flow.dash { stroke-dasharray:5 4; }
.mk { fill: var(--ink); } .mk-sig { fill: var(--w-sig); } .mk-pwr { fill: var(--w-pos); } .mk-water { fill: var(--water-line); }
.enclosure { fill: #F4F6F8; stroke: var(--ink); stroke-width:2; } .shelf { stroke: var(--ink); stroke-width:2; }
.warnbox { fill: var(--warn-bg); stroke: var(--warn-line); stroke-width:1.5; } .warn-t { fill: var(--warn-ink); font: 600 12px var(--font-body); }
.valve { fill: var(--accent); } .clip { fill: var(--muted); }
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker>
<marker id="ar-sig" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-sig"/></marker>
<marker id="ar-pwr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-pwr"/></marker>
<marker id="ar-water" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-water"/></marker>
</defs>
<rect width="752" height="560" rx="14" fill="#FFFFFF" stroke="#C3CDD6"/>
<g transform="translate(16 16)">
