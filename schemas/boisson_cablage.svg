<text x="236" y="188" class="pin-t" text-anchor="middle">D9</text>
<text x="296" y="188" class="pin-t" text-anchor="middle">D2</text>
<rect x="150" y="336" width="110" height="14" rx="2" class="hdr"/>
<rect x="158" y="340" width="6" height="6" class="pin"/>
<rect x="173" y="340" width="6" height="6" class="pin"/>
<rect x="188" y="340" width="6" height="6" class="pin"/>
<rect x="203" y="340" width="6" height="6" class="pin"/>
