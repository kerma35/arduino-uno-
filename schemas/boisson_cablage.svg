<circle cx="443" cy="250" r="4.5" class="dot sig"/>
<circle cx="443" cy="280" r="4.5" class="dot gnd"/>
<text x="514" y="370" class="sub">VCC du module : rien</text><text x="514" y="384" class="sub">(ou 5 V de l'Uno s'il en a besoin)</text>
<circle cx="176" cy="100" r="4.5" class="dot gnd"/>
</g>
