<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 752 500" width="752" height="500">
<title>Principe : la pompe aspire l'eau de la bouteille et l'envoie à l'embout quand on appuie sur le bouton</title>
<style>
:root { --bg:#EBEFF2; --surface:#FFFFFF; --ink:#121B24; --muted:#526170; --line:#C3CDD6;
  --accent:#0A5D7A; --accent-soft:#D3E7EE; --warn-bg:#FFF3D6; --warn-line:#D99A00; --warn-ink:#4A3700; --danger:#BF2229;
  --w-pos:#D7262E; --w-gnd:#1E2328; --w-sig:#EE8600; --w-btn:#2873CF; --w-usb:#707D8A;
  --pcb:#0C8287; --pcb-ink:#E9FBFB; --hdr:#1A1F25; --pin:#D9B55A; --chip:#1F262E; --chip-ink:#C4D0DA;
  --metal:#B5BDC5; --psu:#262B31; --term:#2E9A5B; --mod:#1D3D6E; --mod-ink:#E4ECF8;
  --water:#9FD3EA; --water-line:#2E8BB5; --tube:#E9EEF2; --tube-line:#8FA1B0; --pump:#2A3037; --pump-ink:#E6EAEE;
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; }
svg { color: var(--ink); }
.pcb { fill: var(--pcb); } .mod { fill: var(--mod); } .chip { fill: var(--chip); } .hdr { fill: var(--hdr); } .pin { fill: var(--pin); }
.metal { fill: var(--metal); } .usb-in { fill:#3A4148; } .jack { fill:#1C1F23; stroke: var(--metal); stroke-width:1; }
.term { fill: var(--term); } .screw { fill: var(--metal); stroke:#7D868F; stroke-width:1.5; }
.pcb-name { fill: var(--pcb-ink); font: 700 17px var(--font-display); letter-spacing:.04em; }
.pcb-s { fill: var(--pcb-ink); font: 500 10px var(--font-mono); }
.pin-t { fill: var(--pcb-ink); font: 700 10px var(--font-mono); }
.chip-t { fill: var(--chip-ink); font: 600 10px var(--font-mono); }
.lbl { fill: var(--ink); font: 600 13px var(--font-body); }
.sub { fill: var(--muted); font: 400 12px var(--font-body); }
.sub.red { fill: var(--danger); font-weight: 600; } .sub.accent { fill: var(--accent); font-weight: 600; }
.mono { fill: var(--ink); font: 500 11.5px var(--font-mono); }
.wire { fill:none; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; }
.w-pos { stroke: var(--w-pos); } .w-gnd { stroke: var(--w-gnd); } .w-sig { stroke: var(--w-sig); } .w-btn { stroke: var(--w-btn); }
.w-usb { stroke: var(--w-usb); stroke-width:5; } .cable { fill:none; stroke:#4A525A; stroke-width:5; stroke-linecap:round; }
.dot { stroke: var(--surface); stroke-width:1.5; } .dot.pos { fill: var(--w-pos); } .dot.gnd { fill: var(--w-gnd); } .dot.sig { fill: var(--w-sig); } .dot.btn { fill: var(--w-btn); }
.psu { fill: var(--psu); } .psu-t { fill:#F2F4F6; font: 700 15px var(--font-display); letter-spacing:.05em; } .psu-s { fill:#AEB7C0; font: 400 10.5px var(--font-body); }
.plug { fill:#3B434B; }
.pump { fill: var(--pump); } .pump-t { fill: var(--pump-ink); font: 700 13px var(--font-display); letter-spacing:.06em; }
.rotor { fill: none; stroke: var(--pump-ink); stroke-width: 2; } .roller { fill: var(--metal); }
.tube { fill:none; stroke: var(--tube-line); stroke-width:9; stroke-linecap:round; stroke-linejoin:round; }
.tube-in { fill:none; stroke: var(--water); stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
.bottle { fill: var(--surface); stroke: var(--ink); stroke-width:1.6; } .water { fill: var(--water); }
.cap { fill: var(--accent); }
.diode { fill:#1E2328; } .diode-band { fill: var(--metal); }
.btn-base { fill:#262B31; } .btn-top { fill: var(--w-btn); }
.box { fill: var(--surface); stroke: var(--ink); stroke-width:1.4; } .box.hl { fill: var(--accent-soft); stroke: var(--accent); stroke-width:2; }
.box.pwr { stroke: var(--w-pos); stroke-width:2; } .box.water { fill:#E3F3FA; stroke: var(--water-line); stroke-width:2; }
.flow { fill:none; stroke: var(--ink); stroke-width:1.8; } .flow.sig { stroke: var(--w-sig); stroke-width:3; } .flow.pwr { stroke: var(--w-pos); stroke-width:2.4; }
.flow.water { stroke: var(--water-line); stroke-width:3; } .flow.dash { stroke-dasharray:5 4; }
.mk { fill: var(--ink); } .mk-sig { fill: var(--w-sig); } .mk-pwr { fill: var(--w-pos); } .mk-water { fill: var(--water-line); }
.enclosure { fill: #F4F6F8; stroke: var(--ink); stroke-width:2; } .shelf { stroke: var(--ink); stroke-width:2; }
.warnbox { fill: var(--warn-bg); stroke: var(--warn-line); stroke-width:1.5; } .warn-t { fill: var(--warn-ink); font: 600 12px var(--font-body); }
.valve { fill: var(--accent); } .clip { fill: var(--muted); }
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker>
<marker id="ar-sig" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-sig"/></marker>
<marker id="ar-pwr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-pwr"/></marker>
<marker id="ar-water" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-water"/></marker>
</defs>
<rect width="752" height="500" rx="14" fill="#FFFFFF" stroke="#C3CDD6"/>
<g transform="translate(16 16)">
<text x="0" y="14" class="lbl">L'eau</text>
<rect x="64.0" y="46" width="22" height="10" rx="2" class="cap"/><path d="M66.0 56 V68 Q40 76 40 94 V172 Q40 180 48 180 H102 Q110 180 110 172 V94 Q110 76 84.0 68 V56 Z" class="bottle"/><rect x="41" y="128.4" width="68" height="50.599999999999994" rx="7" class="water"/>
<text x="75" y="206" class="lbl" text-anchor="middle">Bouteille</text>
<text x="75" y="222" class="sub" text-anchor="middle">trou d'air dans le bouchon</text>
<path d="M75 46 V34 Q75 24 85 24 H250 Q262 24 262 36 V64" class="tube"/><path d="M75 46 V34 Q75 24 85 24 H250 Q262 24 262 36 V64" class="tube-in"/>
<path d="M75 46 V160" class="tube"/><path d="M75 46 V160" class="tube-in"/>
<rect x="214" y="74" width="96" height="72" rx="10" class="pump"/><circle cx="262" cy="110" r="24" class="rotor"/><circle cx="262" cy="93" r="5" class="roller"/><circle cx="277" cy="119" r="5" class="roller"/><circle cx="247" cy="119" r="5" class="roller"/><text x="262" y="164" class="lbl" text-anchor="middle">Pompe péristaltique 12 V</text>
<path d="M310 110 H520 Q540 110 540 90 V60" class="tube"/><path d="M310 110 H520 Q540 110 540 90 V60" class="tube-in"/>
<rect x="528" y="30" width="24" height="30" rx="8" class="valve"/>
<text x="566" y="44" class="lbl">Embout à mordre</text><text x="566" y="60" class="sub">vers la bouche</text>
<path d="M360 96 H440" class="flow water" marker-end="url(#ar-water)"/>
<text x="400" y="80" class="sub accent" text-anchor="middle">tant que tu appuies</text>
<text x="400" y="138" class="sub" text-anchor="middle">à l'arrêt, la pompe pince</text><text x="400" y="153" class="sub" text-anchor="middle">le tuyau : pas de goutte</text>
<line x1="0" y1="236" x2="720" y2="236" stroke="#C3CDD6"/>
<text x="0" y="258" class="lbl">La commande</text>
<rect x="0" y="276" width="150" height="54" rx="9" class="box"/><text x="75.0" y="297.0" class="lbl" text-anchor="middle">Bouton du boîtier</text><text x="75.0" y="314.0" class="sub" text-anchor="middle">entre D2 et GND</text>
<rect x="0" y="350" width="150" height="54" rx="9" class="box"/><text x="75.0" y="371.0" class="lbl" text-anchor="middle">Bouton du volant</text><text x="75.0" y="388.0" class="sub" text-anchor="middle">SimHub › USB</text>
<rect x="230" y="306" width="150" height="70" rx="9" class="box hl"/><text x="305.0" y="328.0" class="lbl" text-anchor="middle">Arduino Uno</text><text x="305.0" y="345.0" class="sub" text-anchor="middle">4 s max par gorgée</text><text x="305.0" y="360.0" class="sub" text-anchor="middle">puis 1 s de pause</text>
<rect x="462" y="306" width="140" height="70" rx="9" class="box"/><text x="532.0" y="335.0" class="lbl" text-anchor="middle">Module MOSFET</text><text x="532.0" y="352.0" class="sub" text-anchor="middle">logic level</text>
<path d="M150 303 H190 Q205 303 205 318 V330 Q205 341 222 341" class="flow" marker-end="url(#ar)"/>
<path d="M150 377 H190 Q205 377 205 362 V352 Q205 341 222 341" class="flow"/>
<path d="M380 341 H454" class="flow sig" marker-end="url(#ar-sig)"/>
<text x="417" y="333" class="mono" text-anchor="middle">D9</text>
<path d="M532 306 V270 Q532 254 516 254 H278 Q262 254 262 238 V170" class="flow sig" marker-end="url(#ar-sig)"/>
<text x="540" y="286" class="sub">fait tourner la pompe</text>
<rect x="462" y="406" width="140" height="46" rx="9" class="box pwr"/><text x="532.0" y="434.0" class="lbl" text-anchor="middle">Alimentation 12 V</text>
<path d="M462 429 H330 Q305 429 305 404 V384" class="flow pwr" marker-end="url(#ar-pwr)"/>
<text x="390" y="422" class="sub" text-anchor="middle">jack de l'Uno</text>
<path d="M532 406 V384" class="flow pwr" marker-end="url(#ar-pwr)"/>
<text x="540" y="398" class="sub">Vin</text>
</g>
</svg>
